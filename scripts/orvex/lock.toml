# Pinned inputs for building a VyOS Stream image from public sources.
#
# The signed Stream source release ships the vyos-build tree and the sources of
# the packages VyOS does not publish on GitHub. Packages whose upstream is
# public are fetched from the commits pinned in scripts/package-build.

[stream]
release = "2026.03"
url = "https://community-downloads.vyos.dev/stream/2026.03/circinus-2026.03.tar.gz"
sha256 = "e9f5b20261b166b72c60b591d00b173673fe704c5f6aaf90404db457c2804910"
# Minisign public key (key id d1d6dcbddceca89e) the release was verified with
# when this lock was written: data/live-build-config/includes.chroot/usr/share/vyos/keys/vyos-release.minisign.pub
signed_by = "RWTR1ty93Oyontk6caB9WqmiQC4fgeyd/ejgRxCRGd2MQej7nqebHneP"
# Timestamp in the signature's trusted comment. Used as the commit date of
# source trees imported from the release, which keeps their commit ids stable.
epoch = 1773942955

[docker]
image = "orvex/vyos-build:circinus-2026.03"

[build]
# Directories of scripts/package-build in build order, then packages without
# one (see [extra]). A directory that is neither listed nor in skip is an
# error, so a Stream bump cannot drop a package unnoticed.
order = [
  "strongswan",
  "frr",
  "tacacs",
  "bash-completion",
  "blackbox_exporter",
  "ddclient",
  "dropbear",
  "ethtool",
  "frr_exporter",
  "hostap",
  "hsflowd",
  "isc-dhcp",
  "isc-kea",
  "keepalived",
  "libnss-mapuser",
  "libpam-radius-auth",
  "ndppd",
  "net-snmp",
  "netfilter",
  "node_exporter",
  "openvpn-otp",
  "owamp",
  "podman",
  "pyhumps",
  "radvd",
  "salt",
  "telegraf",
  "udp-broadcast-relay",
  "vpp",
  "wide-dhcpv6",
  "linux-kernel",
  "vyos-1x",
]
extra = [
  "hvinfo",
  "ipaddrcheck",
  "live-boot",
  "vyatta-bash",
  "vyatta-biosdevname",
  "vyatta-cfg",
  "vyos-http-api-tools",
  "vyos-user-utils",
  "vyos-utils",
]

# Packages a build has to produce, besides any others. build.py goes on after a
# failure, so a build can end with only part of its packages.
[expect]
strongswan = ["charon-systemd", "strongswan-swanctl", "libstrongswan-standard-plugins", "python3-vici"]
frr = ["frr", "frr-snmp", "frr-rpki-rtrlib", "frr-pythontools"]

[build.skip]
amazon-cloudwatch-agent = "cloud flavors only"
amazon-ssm-agent = "cloud flavors only"
aws-gwlbtun = "cloud flavors only"
waagent = "cloud flavors only"
xen-guest-agent = "cloud flavors only"

# package.toml entries whose scm_url/commit_id are replaced by a source tree
# from the Stream release (vyos-tarballs/vyos_tarballs.tar.gz). The upstream is
# either private or only a moving branch.
[tree]
vyos-1x = "vyos-1x"
libnss-mapuser = "libnss-mapuser_circinus"
libpam-radius-auth = "libpam-radius-auth_1.5.0-cl3u7"
libtacplus-map = "libtacplus-map_master"
libpam-tacplus = "libpam-tacplus_master"
libnss-tacplus = "libnss-tacplus_master"

# package.toml entries pinned to a public commit instead.
# vyos-vpp-patches: newest commit of the public rolling branch on 2026-03-18.
# It has the same merge date and message as the NOTvyos mirror's circinus head.
[git.vyos-vpp-patches]
url = "https://github.com/vyos/vyos-vpp-patches"
commit = "a76db6c30854334bb30c3fcad31e7884fea7b4c4"

# vpp: package.toml names the branch stable/2510. This is its newest commit on
# 2026-03-18.
[git.vpp]
url = "https://github.com/FDio/vpp"
commit = "9fae655aba06add05ea9c077fe406bb7e89cd6ec"

# Shell commands set as pre_build_hook of the package.toml entry of that name.
# They run before the build dependencies are installed.
[hook]
# Debian's packaging of strongswan build-depends on systemd-dev, which bookworm
# does not have: there, systemd ships the pkg-config file. The only systemd-dev
# in reach is the one of bookworm-backports, which breaks the systemd of
# bookworm, and apt then removes systemd to resolve it.
strongswan = '''
set -e
dir=$(mktemp -d)
mkdir -p "$dir/systemd-dev/DEBIAN"
printf '%s\n' 'Package: systemd-dev' 'Version: 252.39-orvex1' 'Architecture: all' \
  'Maintainer: orvex <orvex@localhost>' 'Depends: systemd' \
  'Description: Placeholder, the files of systemd-dev are part of systemd in bookworm' \
  > "$dir/systemd-dev/DEBIAN/control"
dpkg-deb --build "$dir/systemd-dev" "$dir/systemd-dev.deb"
sudo apt-get install -y systemd
sudo dpkg -i "$dir/systemd-dev.deb"
'''

# vyos-1x depends on vyos-libpam-radius-auth. The release ships the Cumulus tree
# of libpam-radius-auth, from before VyOS renamed it, and the renamed source is on a
# private branch. This repeats the rename VyOS made to libnss-mapuser (package
# names and a ".1" version), and has not been compared with the private source.
libpam-radius-auth = '''
set -e
cd debian
for f in libpam-radius-auth.* radius-shell.*; do mv "$f" "vyos-$f"; done
sed -i -e 's/^Source: libpam-radius-auth/Source: vyos-libpam-radius-auth/' \
       -e 's/^Package: libpam-radius-auth/Package: vyos-libpam-radius-auth/' \
       -e 's/^Package: radius-shell/Package: vyos-radius-shell/' \
       -e 's/, radius-shell$/, vyos-radius-shell/' \
       -e 's/, libnss-mapuser$/, vyos-libnss-mapuser/' control
sed -i '1s/.*/vyos-libpam-radius-auth (1.5.0-cl3u7.1) RELEASED; urgency=low/' changelog
'''

# The recipe builds nftables from the git tag, which lacks the generated parser
# that Debian's release tarball ships, and its man page is generated. The
# control file does not list the tools for either.
pkg-nftables = '''
sudo apt-get install -y --no-install-recommends bison flex asciidoc-base xsltproc docbook-xsl docbook-xml
'''

# Shell commands run in the build container before the build of that package.
# The container has OCaml under /opt/opam, which opam does not look in by default,
# and the recipe of vyos-utils expects it to. vyos-op-run needs OCaml libraries the
# container does not have.
[env]
vyos-utils = 'eval "$(opam env --root=/opt/opam --set-root)" && sudo /usr/local/bin/opam install --root=/opt/opam -y logs.0.10.0 fmt.0.11.0 yojson.3.0.0 mustache.3.3.0'

# Packages without a scripts/package-build directory: built with the default
# dpkg-buildpackage recipe from a tree of the Stream release.
[extra.hvinfo]
tree = "hvinfo_1.2.0"

[extra.ipaddrcheck]
tree = "ipaddrcheck_1.4"

[extra.live-boot]
tree = "live-boot_20151213"

[extra.vyatta-bash]
tree = "vyatta-bash_4.1-3+vyos2+current2"

[extra.vyatta-biosdevname]
tree = "vyatta-biosdevname_0.3.11+vyos2+current2"

[extra.vyatta-cfg]
tree = "vyatta-cfg_0.102.0+vyos2+current6"

[extra.vyos-http-api-tools]
tree = "vyos-http-api-tools_2.3"

[extra.vyos-user-utils]
tree = "vyos-user-utils_1.4.0+vyos1+current"

# Not part of the release. Newest commit of the public current branch before
# 2026-03-18 18:00 UTC.
[extra.vyos-utils]
git = "https://github.com/vyos/vyos-utils"
commit = "1fd60b557ea15a9129829d7e8a9395c9b656012a"

# VyOS can move or close the repositories it owns, as it did with vyos-utils, so the
# ones the build uses are forked here. Other upstreams are used where they are.
# Keys are the upstream URL without scheme and ".git".
[mirror]
org = "https://github.com/orvexai-vyos"

[mirror.repos]
"github.com/vyos-legacy/vyos-utils" = "vyos-utils"
"github.com/vyos/libnss-tacplus" = "libnss-tacplus"
"github.com/vyos/libpam-radius-auth" = "libpam-radius-auth"
"github.com/vyos/libpam-tacplus" = "libpam-tacplus"
"github.com/vyos/libtacplus-map" = "libtacplus-map"
"github.com/vyos/vyos-1x" = "vyos-1x"
"github.com/vyos/vyos-build" = "vyos-build-upstream"
"github.com/vyos/vyos-live-build" = "vyos-live-build"
"github.com/vyos/vyos-utils" = "vyos-utils"
"github.com/vyos/vyos-vpp-patches" = "vyos-vpp-patches"
