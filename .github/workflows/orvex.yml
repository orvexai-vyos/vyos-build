name: Build VyOS Stream image from source

on:
  push:
    branches:
      - orvex
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# A newer push replaces a build that is still running
concurrency:
  group: orvex
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vyos-build-env

# One job per stage, as a job may run for 6 hours at most. Each stage takes
# over the packages of the one before it through the cache, and a run that
# fails continues from there when it is started again.
jobs:
  # Fails in a minute, before any of the long jobs is started
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/orvex/orvex check

  # The build container, which takes a while to make. Pushed under the hash of
  # its files, so only a change to them makes it again.
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=${IMAGE}:${{ hashFiles('docker/**') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.found != 'true'
      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.found != 'true'
        with:
          context: docker
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  light:
    name: packages (all but VPP, kernel, vyos-1x)
    needs: image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/orvex-stage.yml
    with:
      image: ${{ needs.image.outputs.tag }}
      args: --exclude vpp linux-kernel vyos-1x
      stage: light
      timeout: 240

  vpp:
    name: packages (VPP)
    needs: [image, light]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/orvex-stage.yml
    with:
      image: ${{ needs.image.outputs.tag }}
      args: vpp
      stage: vpp
      timeout: 345

  kernel:
    name: packages (kernel and drivers)
    needs: [image, vpp]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/orvex-stage.yml
    with:
      image: ${{ needs.image.outputs.tag }}
      args: linux-kernel
      stage: kernel
      timeout: 345

  iso:
    name: vyos-1x and image
    needs: [image, kernel]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/orvex-stage.yml
    with:
      image: ${{ needs.image.outputs.tag }}
      args: vyos-1x
      stage: iso
      timeout: 120
      iso: true
